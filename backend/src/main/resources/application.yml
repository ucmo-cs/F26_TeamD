server:
  port: 8081
  error:
    # send ResponseStatusException messages (e.g. "Loan not found") to the frontend
    include-message: always

spring:
  application:
    name: loan-repayment-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/loan_repayment_tracker
    username: loan_app
    password: ${DB_PASSWORD:default_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

mailtrap:
  api-token: ${MAILTRAP_API_TOKEN}
  inbox-id: 5009020
  sandbox: true
  from-email: hello@demomailtrap.co