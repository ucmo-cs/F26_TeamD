server:
  port: 8081

spring:
  application:
    name: loan-repayment-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/loan_repayment_tracker
    username: loan_app
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true